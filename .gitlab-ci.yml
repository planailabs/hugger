stages:
  - test
  - deploy

test:
  stage: test
  tags:
    - nix-image
  script:
    # Unit + HTTP integration + live-Hub tests (live tests skip when offline).
    - bash test.sh
  # 2h, not 1h: a flake input bump invalidates the CI image closure, so the
  # runner cold-builds it inside this job's budget before test.sh even starts
  # (observed 38 min) and test.sh then builds its own devShell. Warm runs take
  # ~16 min, cold ones ~95 min, so 1h only holds on a warm store.
  timeout: 2h

deploy:
  stage: deploy
  tags:
    - nix-image
  only:
    - trunk
  script:
    # Build the OCI image with nix's dockerTools and copy it to the registry.
    - nix develop -c bash docker-push.sh
  timeout: 2h
  environment: production
  resource_group: production
