stages:
  - test
  - deploy

test:
  stage: test
  tags:
    - nix-image
  script:
    # Unit + HTTP integration + live-Hub tests (live tests skip when offline).
    - bash test.sh
  timeout: 1h

deploy:
  stage: deploy
  tags:
    - nix-image
  only:
    - trunk
  script:
    # Build the OCI image with nix's dockerTools and copy it to the registry.
    - nix develop -c bash docker-push.sh
  timeout: 2h
  environment: production
  resource_group: production
