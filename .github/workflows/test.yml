name: Test

on:
  push:
    branches: [ "trunk" ]
  pull_request:

jobs:
  test:

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    - name: Run tests
      run: bash test.sh
