[project]
name = "hugger"
version = "0.1.0"
description = "A HuggingFace model archiver — Python backend, SSR web UI, and one-click browser extension."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-fasthtml>=0.6",
    "huggingface_hub>=0.24",
    "yoyo-migrations>=8.2",
    "argon2-cffi>=23.1",
    "uvicorn>=0.30",
]

[project.scripts]
hugger = "hugger.app:main"

# Test-only deps (PEP 735). selenium drives the browser E2E tests; the browsers
# and their drivers come from nixpkgs, not here. Built into the uv2nix test env.
[dependency-groups]
test = ["selenium>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hugger"]
